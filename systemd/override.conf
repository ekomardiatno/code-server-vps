[Service]
# The editor's extension host plus a TS language server will happily grow past
# a gigabyte. MemoryHigh throttles it first (reclaim pressure, no kill);
# MemoryMax is the hard stop. Both are scoped to this unit, so a runaway editor
# gets killed on its own instead of letting the kernel pick a victim from
# mongod / the docker containers.
MemoryHigh=900M
MemoryMax=1200M
Restart=always
RestartSec=5
