# Reap connections whose client has vanished without closing TCP.
#
# This exists for the reverse tunnel from Eko's Mac (remote forward on
# 127.0.0.1:8094, published as mac.jalanpintas.web.id). A laptop sleeps, changes
# network and sits behind NAT, so that connection dies silently far more often
# than it closes cleanly. With sshd's default ClientAliveInterval 0 the only
# thing that notices is kernel TCP keepalive, which here is
# tcp_keepalive_time 7200 + 9 x 75s, so sshd would hold the 8094 listener for
# about 2h11m. During that window every reconnect from the Mac fails
# ExitOnForwardFailure, and the vhost 504s even though the Mac is awake: nginx
# connects to the port sshd is still holding, then waits for a client that is
# gone. (A 502 is the other, honest failure — nothing listening at all.)
#
# 20s x 3 bounds that at ~60s. It was 60s x 3 (~3 min) first; a network switch
# on 2026-11-10 showed three minutes is long enough to go hunting for a fault
# that does not exist. These are encrypted in-protocol probes that any live
# client answers by itself, so an idle-but-alive interactive session is not
# affected — only genuinely dead ones are dropped. A probe every 20s on a box
# with a handful of sessions costs nothing, but don't go lower without a
# reason: a client on a lossy link that misses three in a row is dropped too.
ClientAliveInterval 20
ClientAliveCountMax 3
