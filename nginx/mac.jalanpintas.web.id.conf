# mac.jalanpintas.web.id — the code-server running on Eko's Mac, published here.
#
# Upstream is 127.0.0.1:8094, which is not a service on this box: it is the
# listening end of a reverse SSH forward that the Mac holds open (launchd agent
# id.my.ekomardiatno.code-tunnel). So the Mac needs no port forward, no public
# IP and no inbound firewall hole — it dials out, and this vhost is the only
# way in. If the Mac is asleep or off the network, 8094 has no listener and
# this vhost returns 502. That is the intended failure mode.
#
# The tunnel key on this box is locked to exactly that one forward
# (command="/bin/false", permitlisten="127.0.0.1:8094"), so a copy of it taken
# off the Mac cannot be used to log in here.
#
# As on code.jalanpintas.web.id, a session upstream is effectively the whole
# machine, hence password auth in code-server, a rate limit on /login, and no
# indexing.

# Zone names are global to the http context. Already taken elsewhere:
# cs_login (code vhost), jp_redirect / jp_catalogue (katalog), emvite_og.
limit_req_zone $binary_remote_addr zone=mac_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mac.jalanpintas.web.id;

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mac.jalanpintas.web.id;

    ssl_certificate     /etc/letsencrypt/live/mac.jalanpintas.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mac.jalanpintas.web.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/mac-code-server.access.log;
    error_log  /var/log/nginx/mac-code-server.error.log;

    # Drag-and-drop uploads into the editor. nginx.conf caps the whole server
    # at 20M, which is far too small for dropping a tarball into a project.
    client_max_body_size 256m;

    include /etc/nginx/snippets/jalanpintas-headers.conf;
    # A login form for a root-equivalent shell has no business in an index.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # The Mac's code-server terminates TLS itself (it also serves the LAN, where
    # there is no nginx in front of it), so the hop through the tunnel is
    # https. Its certificate is self-signed for ekomardiatno.local / 192.168.1.2
    # and could never validate for 127.0.0.1, so verification is off — stated
    # explicitly rather than left to nginx's default, so a future
    # `proxy_ssl_verify on` in the http context cannot silently 502 this site.
    # Confidentiality on this hop comes from the SSH transport, not from TLS.

    location = /login {
        limit_req zone=mac_login burst=5 nodelay;

        # add_header is NOT additive across levels: the one above cancels the
        # entire inherited set for this location, so nosniff / HSTS /
        # Referrer-Policy have to be re-declared here or they are served bare.
        include /etc/nginx/snippets/jalanpintas-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        proxy_ssl_verify off;
        proxy_pass https://127.0.0.1:8094;
        include /etc/nginx/snippets/code-server-proxy.conf;
    }

    location / {
        proxy_ssl_verify off;
        proxy_pass https://127.0.0.1:8094;
        include /etc/nginx/snippets/code-server-proxy.conf;
    }
}
