# code.jalanpintas.web.id — code-server (VS Code in the browser).
#
# Upstream is code-server on 127.0.0.1:8093, running as the `ekomardiatno`
# system user. That user is in sudo/docker/lxd with passwordless sudo, so a
# session here is effectively root on this box. Everything below is sized to
# that fact: password auth in code-server itself, a rate limit on the one
# endpoint that checks it, and no indexing.

# Brute-force budget for the login endpoint. 10r/m with a small burst is
# invisible to a human typing a password and useless to a script. Zone names
# are global to the http context, so this must not collide with jp_redirect /
# jp_catalogue (katalog vhost) or emvite_og (conf.d).
limit_req_zone $binary_remote_addr zone=cs_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name code.jalanpintas.web.id;

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name code.jalanpintas.web.id;

    ssl_certificate     /etc/letsencrypt/live/code.jalanpintas.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/code.jalanpintas.web.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/code-server.access.log;
    error_log  /var/log/nginx/code-server.error.log;

    # Drag-and-drop uploads into the editor. nginx.conf caps the whole server
    # at 20M, which is far too small for dropping a tarball into a project.
    client_max_body_size 256m;

    include /etc/nginx/snippets/jalanpintas-headers.conf;
    # A login form for a root-equivalent shell has no business in an index.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /login {
        limit_req zone=cs_login burst=5 nodelay;

        # add_header is NOT additive across levels: the one above cancels the
        # entire inherited set for this location, so nosniff / HSTS /
        # Referrer-Policy have to be re-declared here or they are served bare.
        include /etc/nginx/snippets/jalanpintas-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        proxy_pass http://127.0.0.1:8093;
        include /etc/nginx/snippets/code-server-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8093;
        include /etc/nginx/snippets/code-server-proxy.conf;
    }
}
