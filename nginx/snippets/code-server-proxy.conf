# /etc/nginx/snippets/code-server-proxy.conf
#
# Like jalanpintas-proxy.conf, but for a websocket-first upstream:
#   - Connection comes from the $connection_upgrade map in
#     conf.d/websocket-upgrade.conf instead of a hardcoded "upgrade".
#   - 3600s timeouts: an idle editor tab holds its socket open for hours, and
#     the default 60s proxy_read_timeout would tear it down mid-session.
#   - proxy_buffering off: terminal output and file-watcher events must stream,
#     not sit in an nginx buffer waiting to fill.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
# No Accept-Encoding override: forcing `gzip` here makes code-server compress
# every response regardless of what the client advertised, so a plain curl gets
# a Content-Encoding it never asked for and cannot read. nginx forwards the
# client's own Accept-Encoding by default, which is what we want.
proxy_read_timeout  3600s;
proxy_send_timeout  3600s;
proxy_buffering     off;
proxy_redirect      off;
