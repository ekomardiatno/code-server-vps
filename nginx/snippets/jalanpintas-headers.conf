# /etc/nginx/snippets/jalanpintas-headers.conf
#
# NOTE: this snippet predates this repo and is SHARED with the other vhosts on
# the host. The copy here exists so the vhost is reproducible and so CI can run
# `nginx -t` — it is not owned by this project. Edit it on the box.
#
# The three site-wide security headers, in a snippet because of an nginx rule
# that is easy to get wrong and silent when you do: add_header is NOT additive
# across levels. A single add_header inside a location REPLACES the whole
# inherited set, so every block that sets its own Cache-Control also has to
# re-declare these or it serves them bare.
#
# Include this in the server block AND in every location that uses add_header.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
