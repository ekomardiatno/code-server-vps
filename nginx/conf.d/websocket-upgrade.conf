# /etc/nginx/conf.d/websocket-upgrade.conf
#
# code-server is websocket-first: the editor UI is a spinner forever if the
# upgrade does not pass through. The existing jalanpintas-proxy.conf snippet
# hardcodes `Connection "upgrade"` on every request, which is wrong for plain
# HTTP (it breaks keepalive); this map sets it only when the client asked.
# conf.d is included before sites-enabled, so the map exists by vhost parse time.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
